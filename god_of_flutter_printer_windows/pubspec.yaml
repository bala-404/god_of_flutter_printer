name: god_of_flutter_printer_windows
description: Windows native USB and Bluetooth printing for God of Flutter Printer.
version: 0.1.0
homepage: https://github.com/bala-404/god_of_flutter_printer
repository: https://github.com/bala-404/god_of_flutter_printer

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: PrintWorkerWindowsPluginCApi
