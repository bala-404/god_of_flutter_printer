name: god_of_flutter_printer
description: >-
  God of Flutter Printer — cross-platform thermal & label printing (ESC/POS, TSPL, ZPL)
  for Windows, Android, iOS, and Web. USB, Bluetooth/BLE, and network TCP.
version: 0.1.1
homepage: https://github.com/bala-404/god_of_flutter_printer
repository: https://github.com/bala-404/god_of_flutter_printer
issue_tracker: https://github.com/bala-404/god_of_flutter_printer/issues

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  god_of_flutter_printer_platform_interface: ^0.1.1
  god_of_flutter_printer_windows: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.godofflutterprinter.god_of_flutter_printer
        pluginClass: PrintWorkerPlugin
      ios:
        pluginClass: PrintWorkerPlugin
      windows:
        default_package: god_of_flutter_printer_windows
  assets:
    - assets/templates/
    - assets/fonts/
